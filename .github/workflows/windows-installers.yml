name: Build Windows installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Build installers
        shell: pwsh
        run: .\installer\build.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: espresso-windows-installers
          path: target/installers/*

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $files = Get-ChildItem -LiteralPath target/installers -File | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) {
            throw "No installer files were produced."
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG @files --repo $env:GITHUB_REPOSITORY --title "Espresso $env:RELEASE_TAG" --generate-notes
          }
