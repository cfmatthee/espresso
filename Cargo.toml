[package]
name = "espresso"
version = "0.1.0"
description = "A windows tray application that prevents the computer from sleeping"
authors = ["CF Matthee"]
license = "Unlicense"
repository = "https://github.com/cfmatthee/espresso"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
] }
tray-icon = "0.26"
